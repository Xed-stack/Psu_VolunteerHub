<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>{% block title %}PSU Volunteer Hub{% endblock %}</title>
    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/PSU-logo.png') }}"
      type="image/png"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    >
    {% block styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/app.css') }}">
  </head>
  <body class="public-page">
    {% block body %}
      {% block content %}{% endblock %}
    {% endblock %}
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='scripts/form-submit-state.js') }}"></script>
    {% include 'partials/session_idle.html' %}
  <script src="{{ url_for('static', filename='scripts/workspace.js') }}"></script>
<script src="{{ url_for('static', filename='scripts/drafts.js') }}"></script>
</body>
</html>
