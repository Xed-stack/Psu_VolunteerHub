<script>
  (() => {
    const token = {{ csrf_token()|tojson }};
    document.querySelectorAll('form').forEach(form => {
      if (form.method.toLowerCase() !== 'post' || form.elements.csrf_token) return;
      const field = document.createElement('input');
      field.type = 'hidden';
      field.name = 'csrf_token';
      field.value = token;
      form.prepend(field);
    });
  })();
</script>
