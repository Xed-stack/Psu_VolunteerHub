{% extends 'layouts/auth_base.html' %}
{% block title %}Choose a new password | PSU Volunteer Hub{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-brand"><img src="{{ url_for('static', filename='assets/PSU-logo.png') }}" alt="PSU logo"><h1>Choose a new password</h1><p>Your other active sessions will be signed out.</p></section>
  <section class="auth-form"><h1>New password</h1><form method="post">{% include 'partials/csrf_field.html' %}<label class="field">New password<input type="password" name="password" minlength="{{ password_min }}" autocomplete="new-password" required></label><label class="field">Confirm password<input type="password" name="password_confirmation" minlength="{{ password_min }}" autocomplete="new-password" required></label><button class="button button--primary button--block" type="submit">Reset password</button></form></section>
</main>
{% endblock %}
