{% extends 'layouts/auth_base.html' %}
{% block title %}Reset password | PSU Volunteer Hub{% endblock %}
{% block body %}
<main class="auth-shell">
  <section class="auth-brand"><img src="{{ url_for('static', filename='assets/PSU-logo.png') }}" alt="PSU logo"><h1>Recover your account</h1><p>We will send a single-use reset link if the account exists.</p></section>
  <section class="auth-form"><h1>Reset password</h1><form method="post">{% include 'partials/csrf_field.html' %}<label class="field">Institutional email<input type="email" name="email" autocomplete="email" required></label><button class="button button--primary button--block" type="submit">Send reset link</button></form><p><a href="{{ url_for('auth.login') }}">Return to sign in</a></p></section>
</main>
{% endblock %}
