<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% if user %}Edit User{% else %}Add User{% endif %} | PSU Volunteer Hub</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "var(--primary)",
            "on-primary": "var(--on-primary)",
            "primary-fixed": "var(--primary-fixed)",
            "on-primary-fixed": "var(--on-primary-fixed)",
            "surface": "var(--surface)",
            "surface-container-low": "var(--surface-container-low)",
            "on-surface": "var(--on-surface)",
            "on-surface-variant": "var(--on-surface-variant)",
            "outline-variant": "var(--outline-variant)",
            "error": "var(--error)",
            "error-container": "var(--error-container)",
            "secondary": "var(--secondary)",
            "tertiary-fixed-dim": "var(--tertiary-fixed-dim)"
          },
          spacing: {
            "xs": "4px", "sm": "8px", "base": "4px", "md": "16px", "lg": "24px", "xl": "32px", "2xl": "48px"
          },
          fontSize: {
            "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "500"}],
            "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}],
            "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
            "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    :root { --primary: #00408b; --on-primary: #ffffff; --primary-fixed: #d8e2ff; --on-primary-fixed: #001a41; --surface: #f9f9ff; --surface-container-low: #f0f3ff; --on-surface: #111c2c; --on-surface-variant: #424752; --outline-variant: #c2c6d4; --error: #ba1a1a; --error-container: #ffdad6; --secondary: #5b5f61; }
    body { font-family: 'Inter', sans-serif; background: var(--surface); color: var(--on-surface); }
    :focus-visible { outline: 2px solid #00408b; outline-offset: 2px; border-radius: 4px; }
    input, select, button { min-height: 44px; }
    .transition { transition-duration: 180ms; }
  </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/base.css') }}">
    </head>
<body class="min-h-screen flex items-center justify-center p-lg">
  <div class="w-full max-w-lg bg-white p-lg sm:p-xl rounded-xl border border-outline-variant shadow-[0_1px_3px_rgba(0,0,0,0.06),0_4px_16px_rgba(0,64,139,0.06)]">
    <h1 class="font-headline-md text-headline-md text-primary mb-lg">{% if user %}Edit User{% else %}Add User{% endif %}</h1>
    
    {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for cat, msg in messages %}<div class="p-md mb-md rounded-lg {% if cat == 'error' %}bg-error-container text-error{% else %}bg-primary-fixed text-on-primary-fixed{% endif %} font-label-md">{{ msg }}</div>{% endfor %}{% endif %}{% endwith %}
    
    <form method="POST" class="space-y-lg">
      <div class="space-y-xs">
        <label class="font-label-md text-label-md text-on-surface-variant" for="name">Full Name</label>
        <input id="name" name="name" value="{{ user.name if user else '' }}" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-body-md outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
      </div>
      <div class="space-y-xs">
        <label class="font-label-md text-label-md text-on-surface-variant" for="email">Email</label>
        <input id="email" name="email" value="{{ user.email if user else '' }}" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-body-md outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
      </div>
      {% if not user %}
      <div class="space-y-xs">
        <label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
        <input id="password" name="password" type="password" required class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-body-md outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
      </div>
      {% endif %}
      <div class="space-y-xs">
        <label class="font-label-md text-label-md text-on-surface-variant" for="role">Role</label>
        <select id="role" name="role" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-body-md outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
          <option value="volunteer" {% if user and user.role == 'volunteer' %}selected{% endif %}>Volunteer</option>
          <option value="coordinator" {% if user and user.role == 'coordinator' %}selected{% endif %}>Coordinator</option>
          <option value="director" {% if user and user.role == 'director' %}selected{% endif %}>Director</option>
          <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>
      <div class="space-y-xs">
        <label class="font-label-md text-label-md text-on-surface-variant" for="campus_id">Campus</label>
        <select id="campus_id" name="campus_id" class="w-full bg-surface-container-low border border-outline-variant rounded-lg px-md py-sm font-body-md outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition">
          <option value="">Select Campus</option>
          {% for campus in campuses %}
          <option value="{{ campus.id }}" {% if user and user.campus_id == campus.id %}selected{% endif %}>{{ campus.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex flex-col sm:flex-row gap-md pt-md">
        <button type="submit" class="min-h-[44px] bg-primary text-on-primary px-lg py-sm rounded-lg font-label-md hover:bg-[#003370] hover:shadow-[0_4px_12px_rgba(0,64,139,0.2)] active:opacity-90 transition">{% if user %}Save Changes{% else %}Create User{% endif %}</button>
        <a href="{{ url_for('admin.admin_dash') }}" class="inline-flex items-center justify-center min-h-[44px] border border-outline-variant text-on-surface-variant px-lg py-sm rounded-lg font-label-md hover:bg-surface-container-low transition">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
